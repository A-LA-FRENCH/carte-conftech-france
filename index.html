<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>France tech conference map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: an atlas plate. Map of France pinned on the left, dated agenda on the right, one filter bar above both. */
:root{
  --sea:#e9eef4; --land:#fbfcfd; --line:#c5cfdb; --ink:#14213a; --muted:#56637a;
  --panel:#ffffff; --accent:#1f4fd8; --accent-soft:#dbe5fb; --sig:#b3261e;
  --c-dev:#2f6fed; --c-ai:#8b5cf6; --c-api:#d6336c; --c-cloud:#0e93a0; --c-green:#2a9454;
  --c-cyber:#c2410c; --c-data:#b88a00; --c-oss:#6f7f16; --c-lead:#6b7280; --c-eco:#93654a;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sea:#0e1524; --land:#1a2438; --line:#33425e; --ink:#e8edf6; --muted:#9aa8c0;
    --panel:#151e31; --accent:#7ea2ff; --accent-soft:#22335c; --sig:#ff8a80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sea:#0e1524; --land:#1a2438; --line:#33425e; --ink:#e8edf6; --muted:#9aa8c0;
  --panel:#151e31; --accent:#7ea2ff; --accent-soft:#22335c; --sig:#ff8a80;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.4vw,38px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;max-width:65ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:7px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.bar{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:64px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font:500 13px var(--body);cursor:pointer}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip.sig[aria-pressed="true"]{border-color:var(--sig)}
.sel{border:1px solid var(--line);background:var(--land);color:var(--ink);border-radius:8px;padding:6px 8px;font:500 13px var(--body)}
details.pastbox{margin-top:18px}
details.pastbox summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 2px;margin-bottom:8px}
#q{flex:1 1 200px;min-width:160px;border:1px solid var(--line);background:var(--land);color:var(--ink);border-radius:8px;padding:7px 10px;font:400 14px var(--body)}
button:focus-visible,#q:focus-visible,a:focus-visible,.pin:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.mapcard{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
svg{display:block;width:100%;height:auto}
.region{fill:var(--land);stroke:var(--line);stroke-width:.8;stroke-linejoin:round}
.pin{cursor:pointer}
.pin circle{fill:var(--accent);fill-opacity:.82;stroke:var(--panel);stroke-width:1.5;transition:fill-opacity .15s}
.pin:hover circle,.pin.on circle{fill-opacity:1}
.pin.on circle{stroke:var(--ink);stroke-width:2.2}
.pin .cnt{fill:#fff;font:600 11px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
:root[data-theme="dark"] .pin .cnt{fill:#0e1524}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pin .cnt{fill:#0e1524}}
.plabel{fill:var(--ink);font:500 11px var(--body);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.inset rect{fill:var(--sea);stroke:var(--line)}
.inset .ring{fill:var(--land);stroke:var(--line);stroke-dasharray:3 3}
.inset .ttl{fill:var(--muted);font:600 10px var(--body);letter-spacing:.06em;text-transform:uppercase}
.inset .plabel{font-size:9.5px;stroke:var(--sea)}
.leader{stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 3;fill:none}
.omlbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 4px 6px}
.om{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px}
.omt{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--sea);border:1px solid var(--line);border-radius:8px;padding:6px 4px 5px;color:var(--ink);font:500 11.5px var(--body);cursor:pointer;line-height:1.2;text-align:center}
.omt svg{width:60px;height:44px}
.omt .region{stroke-width:1}
.omt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.omt .cn{position:absolute;top:4px;right:5px;min-width:17px;height:17px;border-radius:9px;font:600 10.5px/17px var(--body);color:var(--muted);border:1px solid var(--line);background:var(--panel);font-variant-numeric:tabular-nums}
.omt .cn.has{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.maphint{color:var(--muted);font-size:12.5px;margin:6px 4px 2px}
.listhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin:2px 2px 10px}
.listhead h2{font-family:var(--display);font-size:20px;margin:0}
.place{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:999px;padding:3px 10px;font:500 13px var(--body);cursor:pointer}
.month{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.month:first-child{margin-top:0}
.ev{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.ev.past{opacity:.7}
.date{font-variant-numeric:tabular-nums;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.date b{display:block;font-family:var(--display);font-size:22px;line-height:1.05}
.date span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ev h3{margin:0;font:600 16px/1.25 var(--body)}
.ev h3 a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.ev h3 a:hover{border-color:var(--accent);color:var(--accent)}
.where{color:var(--muted);font-size:13.5px;margin:2px 0 4px}
.desc{margin:0 0 6px;font-size:14px;max-width:65ch}
.note{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;font-weight:500;border-radius:4px;padding:1px 7px;border:1px solid var(--c);color:var(--ink);border-left-width:4px}
.tag.sig{border-color:var(--sig);color:var(--sig);font-weight:600}
.tag.live{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
footer{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
footer a{color:var(--accent)}
footer p{margin:0;max-width:95ch}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.mapcard{position:static}}
@media (max-width:420px){.ev{grid-template-columns:58px minmax(0,1fr);gap:9px}.date b{font-size:18px}.row .lbl{min-width:100%}}
@media (prefers-reduced-motion: reduce){.pin circle{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" id="lang-fr" aria-pressed="true">Français</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </header>

  <section class="bar" aria-label="Filtres">
    <div class="row" id="cats"></div>
    <div class="row">
      <span class="lbl" id="lbl-when"></span>
      <select id="month" class="sel"></select>
      <button type="button" class="chip sig" id="sigbtn" aria-pressed="false"></button>
      <input id="q" type="search" autocomplete="off">
    </div>
  </section>

  <div class="grid">
    <div class="mapcard">
      <svg id="map" viewBox="0 0 600 600" role="group" aria-label="Carte de France"></svg>
      <p class="omlbl" id="omlbl"></p>
      <div class="om" id="om"></div>
      <p class="maphint" id="maphint"></p>
    </div>
    <div>
      <div class="listhead">
        <h2 id="count"></h2>
        <span id="placechip"></span>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <footer>
    <p id="f1"></p>
    <p id="f2"></p>
    <p id="f3"></p>
  </footer>
</div>

      f1:"Sources: <a href='https://dev.events/EU/FR'>dev.events</a>, <a href='https://github.com/scraly/developers-conferences-agenda'>developers-conferences-agenda</a>, <a href='https://www.agenda-tech.com/agenda'>Agenda Tech</a>, the <a href='https://lettreouverte.afup.org/#signataires'>AFUP open letter</a> and organisers' own sites.",
      f3:"Check dates and venues with organisers before booking. Overseas France: few events publish dates in advance; the weekly refresh also watches local meetup.com groups. The 29 FOST conferences (CNIT Forest, 1–3 December 2026) are counted separately. Not on the map because no location is published: The Principal Dev (3–4 December) and Clean Architecture Masterclass (10–11 December), both listed by dev.events."}
};

let lang = (navigator.language||"fr").toLowerCase().startsWith("fr") ? "fr" : "en";
const st = {cats:new Set(), month:"all", sig:false, q:"", place:null, venue:null};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };

// Same projection as the region outlines
const K=58, LON0=-5.4, LAT0=51.25, C=Math.cos(46.5*Math.PI/180);
const proj = (lat,lon) => [(lon-LON0)*C*K, (LAT0-lat)*K];
// Paris inset
const IN = {x:6,y:410,w:215,h:180,clat:48.862,clon:2.315,k:1150};
const iproj = (lat,lon) => [IN.x+IN.w/2+(lon-IN.clon)*0.658*IN.k, IN.y+IN.h/2+8+(IN.clat-lat)*IN.k];

const isPast = ev => D(ev.e) < TODAY;
function matches(ev, ignorePlace){
  if (st.cats.size && !ev.c.some(c => st.cats.has(c))) return false;
  if (st.month!=="all" && !(ev.s.slice(0,7)<=st.month && st.month<=ev.e.slice(0,7))) return false;
  if (st.sig && !ev.sig) return false;
  if (st.q){
    const hay = [ev.n, PLACES[ev.p][2], PLACES[ev.p][3], ev.v?ev.v.fr:"", ev.d.fr, ev.d.en, ev.sig||"", ev.c.map(c=>CATS[c].fr+" "+CATS[c].en).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(st.q)) return false;
  }
  if (!ignorePlace){
    if (st.place && ev.p!==st.place) return false;
    if (st.venue && ev.vk!==st.venue) return false;
  }
  return true;
}

function fmtDate(ev){
  const loc = lang==="fr" ? "fr-FR" : "en-GB";
  const s = D(ev.s), e = D(ev.e);
  const mon = d => new Intl.DateTimeFormat(loc,{month:"short"}).format(d).replace(".","");
  if (ev.s===ev.e) return {big:String(s.getDate()), small:mon(s)};
  if (s.getMonth()===e.getMonth()) return {big:s.getDate()+"–"+e.getDate(), small:mon(s)};
  return {big:s.getDate()+"–"+e.getDate(), small:mon(s)+" – "+mon(e)};
}

function renderFilters(){
  const t = T[lang];
  const base = E.filter(ev => { if (isPast(ev)) return false; const keep = st.cats; st.cats = new Set(); const r = matches(ev,false); st.cats = keep; return r; });
  $("cats").innerHTML = "<span class='lbl'>"+t.topic+"</span>" + Object.keys(CATS).map(k => {
    const n = base.filter(ev => ev.c.includes(k)).length;
    return "<button type='button' class='chip' data-cat='"+k+"' aria-pressed='"+st.cats.has(k)+"' style='--c:var(--c-"+k+")'><span class='dot'></span>"+esc(CATS[k][lang])+" <span class='n'>"+n+"</span></button>";
  }).join("");
  const ms = [...new Set(E.filter(ev => !isPast(ev)).flatMap(ev => [ev.s.slice(0,7), ev.e.slice(0,7)]))].sort();
  const mf = new Intl.DateTimeFormat(lang==="fr"?"fr-FR":"en-GB",{month:"long",year:"numeric"});
  $("month").innerHTML = "<option value='all'>"+t.all+"</option>"+ms.map(m => "<option value='"+m+"'>"+esc(mf.format(D(m+"-01")))+"</option>").join("");
  $("month").value = st.month; $("month").setAttribute("aria-label", t.when);
  $("sigbtn").textContent = t.sig; $("sigbtn").setAttribute("aria-pressed", st.sig);
  $("lbl-when").textContent = t.when; $("q").placeholder = t.q; $("q").setAttribute("aria-label", t.q);
}

function pin(x,y,n,label,dx,dy,anchor,attr,on,title){
  const r = 6 + Math.sqrt(n)*3.2;
  const ly = dy<0 ? y-r+dy+10 : (dy>10 ? y+r+dy-8 : y+dy);
  const lx = anchor==="end" ? x-r+dx+8 : (anchor==="start" ? x+r+dx-6 : x+dx);
  return "<g class='pin"+(on?" on":"")+"' tabindex='0' role='button' "+attr+" aria-label='"+esc(title)+"'><title>"+esc(title)+"</title>"+
    "<circle cx='"+x.toFixed(1)+"' cy='"+y.toFixed(1)+"' r='"+r.toFixed(1)+"'></circle>"+
    "<text class='cnt' x='"+x.toFixed(1)+"' y='"+y.toFixed(1)+"'>"+n+"</text></g>"+
    "<text class='plabel' x='"+lx.toFixed(1)+"' y='"+ly.toFixed(1)+"' text-anchor='"+anchor+"'>"+esc(label)+"</text>";
}

function renderMap(){
  const t = T[lang], li = lang==="fr"?2:3;
  const vis = E.filter(ev => !isPast(ev) && matches(ev,true));
  let h = REGIONS.map(d => "<path class='region' d='"+d+"'></path>").join("");
  // inset frame
  const [px,py] = proj(PLACES.idf[0], PLACES.idf[1]);
  h += "<path class='leader' d='M"+(IN.x+IN.w)+","+IN.y+" L"+px.toFixed(1)+","+py.toFixed(1)+"'></path>";
  const byPlace = {}, byVenue = {};
  vis.forEach(ev => { byPlace[ev.p]=(byPlace[ev.p]||0)+1; if (ev.vk) byVenue[ev.vk]=(byVenue[ev.vk]||0)+1; });
  Object.keys(PLACES).forEach(k => {
    const n = byPlace[k]; if (!n || PLACES[k][0]===null) return;
    const P = PLACES[k], [x,y] = proj(P[0],P[1]);
    h += pin(x,y,n,P[li],P[4],P[5],P[6],"data-place='"+k+"'",st.place===k && !st.venue,P[li]+" : "+t.count(n));
  });
  const [cx,cy] = iproj(48.8566,2.347);
  h += "<g class='inset'><rect x='"+IN.x+"' y='"+IN.y+"' width='"+IN.w+"' height='"+IN.h+"' rx='8'></rect>"+
       "<ellipse class='ring' cx='"+cx.toFixed(1)+"' cy='"+cy.toFixed(1)+"' rx='"+(0.078*0.658*IN.k).toFixed(0)+"' ry='"+(0.043*IN.k).toFixed(0)+"'></ellipse>"+
       "<text class='ttl' x='"+(IN.x+9)+"' y='"+(IN.y+15)+"'>"+t.inset+"</text>";
  Object.keys(VENUES).forEach(k => {
    const n = byVenue[k]; if (!n) return;
    const V = VENUES[k], [x,y] = iproj(V[0],V[1]);
    const r = 4 + Math.sqrt(n)*2.2;
    const on = st.venue===k;
    const ly = V[5]<0 ? y-r-3 : (V[5]>10 ? y+r+10 : y+3);
    const lx = V[6]==="end" ? x-r-3 : (V[6]==="start" ? x+r+3 : x);
    h += "<g class='pin"+(on?" on":"")+"' tabindex='0' role='button' data-venue='"+k+"' aria-label='"+esc(V[li]+" : "+t.count(n))+"'><title>"+esc(V[li]+" : "+t.count(n))+"</title>"+
         "<circle cx='"+x.toFixed(1)+"' cy='"+y.toFixed(1)+"' r='"+r.toFixed(1)+"'></circle>"+
         "<text class='cnt' style='font-size:9px' x='"+x.toFixed(1)+"' y='"+y.toFixed(1)+"'>"+n+"</text></g>"+
         "<text class='plabel' x='"+lx.toFixed(1)+"' y='"+ly.toFixed(1)+"' text-anchor='"+V[6]+"'>"+esc(V[li])+"</text>";
  });
  h += "</g>";
  $("map").innerHTML = h;
  $("omlbl").textContent = t.om;
  $("om").innerHTML = Object.keys(OM).map(k => {
    const n = byPlace[k]||0, nm = OM[k][lang==="fr"?0:1];
    return "<button type='button' class='omt' data-om='"+k+"' aria-pressed='"+(st.place===k)+"' aria-label='"+esc(nm+" : "+t.count(n))+"'>"+
      "<svg viewBox='0 0 60 44' aria-hidden='true'>"+(OMPATH[k] ? "<path class='region' d='"+OMPATH[k]+"'></path>" : "<circle class='region' cx='30' cy='22' r='5'></circle><circle class='region' cx='18' cy='15' r='2.5'></circle><circle class='region' cx='43' cy='30' r='3'></circle>")+"</svg>"+
      "<span class='nm'>"+esc(nm)+"</span><span class='cn"+(n?" has":"")+"'>"+n+"</span></button>";
  }).join("");
  $("maphint").textContent = t.hint;
}

function card(ev, t, li){
  const s = D(ev.s), e = D(ev.e), f = fmtDate(ev), past = isPast(ev), live = s<=TODAY && e>=TODAY;
  const where = PLACES[ev.p][li].replace(" & La Défense","").replace(" & Labège","") + (ev.v ? " · "+ev.v[lang] : "");
  return "<article class='ev"+(past?" past":"")+"'><div class='date'><b>"+f.big+"</b><span>"+esc(f.small)+(past?" "+s.getFullYear():"")+"</span></div><div>"+
    "<h3><a href='"+esc(ev.u)+"'>"+esc(ev.n)+"</a></h3>"+
    "<p class='where'>"+esc(where)+"</p>"+
    "<p class='desc'>"+esc(ev.d[lang])+"</p>"+
    (ev.note ? "<p class='note'>"+esc(ev.note[lang])+"</p>" : "")+
    "<div class='tags'>"+(live?"<span class='tag live'>"+t.live+"</span>":"")+
    ev.c.map(c => "<span class='tag' style='--c:var(--c-"+c+")'>"+esc(CATS[c][lang])+"</span>").join("")+
    (ev.sig ? "<span class='tag sig' title='"+esc(ev.sig)+"'>"+t.sigtag+"</span>" : "")+"</div></div></article>";
}
function renderList(){
  const t = T[lang], li = lang==="fr"?2:3, loc = lang==="fr"?"fr-FR":"en-GB";
  const all = E.filter(ev => matches(ev,false)).sort((a,b) => a.s<b.s?-1:a.s>b.s?1:a.e<b.e?-1:a.e>b.e?1:a.n.localeCompare(b.n));
  const vis = all.filter(ev => !isPast(ev)), past = all.filter(isPast).reverse();
  $("count").textContent = t.count(vis.length);
  const pl = st.venue ? VENUES[st.venue][li] : (st.place ? PLACES[st.place][li] : null);
  $("placechip").innerHTML = pl ? "<button type='button' class='place' id='clearplace' aria-label='"+esc(t.clear)+"'>"+esc(pl)+" ✕</button>" : "";
  let h = "", cur = "";
  if (!vis.length) h = "<div class='empty'>"+t.empty+"</div>";
  vis.forEach(ev => {
    const m = new Intl.DateTimeFormat(loc,{month:"long",year:"numeric"}).format(D(ev.s));
    if (m!==cur){ cur = m; h += "<div class='month'>"+esc(m)+"</div>"; }
    h += card(ev,t,li);
  });
  if (past.length) h += "<details class='pastbox'><summary>"+t.past+" ("+past.length+")</summary>"+past.map(ev => card(ev,t,li)).join("")+"</details>";
  $("list").innerHTML = h;
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $("title").textContent = t.title; $("sub").textContent = t.sub;
  $("lang-fr").setAttribute("aria-pressed", lang==="fr"); $("lang-en").setAttribute("aria-pressed", lang==="en");
  $("f1").innerHTML = t.f1 + " " + t.upd + new Intl.DateTimeFormat(lang==="fr"?"fr-FR":"en-GB",{dateStyle:"long"}).format(D(UPDATED)) + ".";
  $("f2").textContent = t.sigs + [...new Set(E.filter(ev => ev.sig && !isPast(ev)).map(ev => ev.sig))].join(", ") + ".";
  $("f3").textContent = t.f3;
  renderFilters(); renderMap(); renderList();
}

$("lang-fr").onclick = () => { lang="fr"; render(); };
$("lang-en").onclick = () => { lang="en"; render(); };
$("cats").addEventListener("click", ev => { const b = ev.target.closest("[data-cat]"); if (!b) return; const k = b.dataset.cat; st.cats.has(k) ? st.cats.delete(k) : st.cats.add(k); render(); });
$("month").addEventListener("change", ev => { st.month = ev.target.value; render(); });
$("sigbtn").onclick = () => { st.sig = !st.sig; render(); };
$("q").addEventListener("input", ev => { st.q = ev.target.value.trim().toLowerCase(); renderFilters(); renderMap(); renderList(); });
function pick(g){
  if (g.dataset.venue){ const k = g.dataset.venue; if (st.venue===k){ st.venue=null; st.place=null; } else { st.venue=k; st.place="idf"; } }
  else { const k = g.dataset.place; if (st.place===k && !st.venue){ st.place=null; } else { st.place=k; st.venue=null; } }
  renderMap(); renderList();
}
$("om").addEventListener("click", ev => { const b = ev.target.closest("[data-om]"); if (!b) return; const k = b.dataset.om; st.venue = null; st.place = st.place===k ? null : k; renderMap(); renderList(); });
$("map").addEventListener("click", ev => { const g = ev.target.closest(".pin"); if (g) pick(g); });
$("map").addEventListener("keydown", ev => { if (ev.key==="Enter"||ev.key===" "){ const g = ev.target.closest(".pin"); if (g){ ev.preventDefault(); pick(g); } } });
$("placechip").addEventListener("click", () => { st.place=null; st.venue=null; renderMap(); renderList(); });
render();
</script>
</body>
</html>
